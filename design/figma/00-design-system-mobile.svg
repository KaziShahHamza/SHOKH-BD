    <line x1="16" y1="950" x2="374" y2="950" stroke="#DCE0E6"/>
    <text x="16" y="982" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="18" font-weight="500">05. Product Card (2-Col Mobile)</text>

    <!-- Card 1 -->
    <rect x="16" y="1000" width="172" height="140" rx="2" fill="#EEF0F3"/>
    <rect x="24" y="1008" width="36" height="18" rx="2" fill="#C8A96B"/>
    <text x="42" y="1020" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="9" font-weight="600">NEW</text>
    <circle cx="102" cy="1070" r="28" fill="#F8F9FA" stroke="#1F1F1F" stroke-width="3"/>
    <text x="16" y="1158" fill="#8C969E" font-family="Inter, sans-serif" font-size="10" font-weight="500">WATCHES</text>
    <text x="16" y="1176" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">Matte Chrono 40mm</text>
    <text x="16" y="1196" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13" font-weight="500">৳ 2,450</text>

    <!-- Card 2 -->
    <rect x="202" y="1000" width="172" height="140" rx="2" fill="#EEF0F3"/>
    <rect x="210" y="1008" width="36" height="18" rx="2" fill="#F8F9FA" stroke="#DCE0E6"/>
    <text x="228" y="1020" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="9" font-weight="500">-15%</text>
    <text x="202" y="1158" fill="#8C969E" font-family="Inter, sans-serif" font-size="10" font-weight="500">GLASSES</text>
    <text x="202" y="1176" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">Square UV400 Frame</text>
    <text x="202" y="1196" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13" font-weight="500">৳ 1,190</text>
    <text x="256" y="1196" fill="#8C969E" font-family="Inter, sans-serif" font-size="11" text-decoration="line-through">৳ 1,400</text>
