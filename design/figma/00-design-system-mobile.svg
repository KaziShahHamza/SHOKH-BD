    <text x="28" y="867" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="14">01712345678</text>

    <rect x="16" y="900" width="76" height="24" rx="2" fill="#F0FDF4"/>
    <text x="54" y="916" text-anchor="middle" fill="#15803D" font-family="Inter, sans-serif" font-size="10" font-weight="500">IN STOCK</text>

    <rect x="100" y="900" width="86" height="24" rx="2" fill="#FFFBEB"/>
    <text x="143" y="916" text-anchor="middle" fill="#B45309" font-family="Inter, sans-serif" font-size="10" font-weight="500">LOW STOCK</text>

    <rect x="194" y="900" width="88" height="24" rx="2" fill="#EFF6FF"/>
    <text x="238" y="916" text-anchor="middle" fill="#1D4ED8" font-family="Inter, sans-serif" font-size="10" font-weight="500">CONFIRMED</text>

