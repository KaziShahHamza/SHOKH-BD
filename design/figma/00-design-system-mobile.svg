    <text x="195" y="679" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="14" font-weight="600">Add to Bag</text>

    <rect x="16" y="708" width="83" height="40" rx="2" fill="#F8F9FA" stroke="#CBD2D9"/>
    <text x="57" y="733" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">S</text>
    <rect x="107" y="708" width="83" height="40" rx="2" fill="#1F1F1F"/>
    <text x="148" y="733" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="13" font-weight="500">M</text>
    <rect x="198" y="708" width="83" height="40" rx="2" fill="#F8F9FA" stroke="#CBD2D9"/>
    <text x="239" y="733" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">L</text>
    <rect x="289" y="708" width="85" height="40" rx="2" fill="#F8F9FA" stroke="#CBD2D9"/>
    <text x="331" y="733" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">XL</text>
  </g>

