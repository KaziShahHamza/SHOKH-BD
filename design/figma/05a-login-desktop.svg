    <text x="790" y="164" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">7-Day Easy Exchange</text>
    <text x="790" y="192" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Size &amp; Fit Guide</text>
