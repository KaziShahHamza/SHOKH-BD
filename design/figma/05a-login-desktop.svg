  <!-- 02. CENTERED LOGIN CARD (/login) -->
  <g id="02-Login-Card">
    <rect x="510" y="188" width="420" height="532" rx="2" fill="#FFFFFF" stroke="#DCE0E6"/>

    <text x="546" y="242" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.4">Sign In</text>
    <text x="546" y="268" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="13">Welcome back to SHOKH. Track orders &amp; saved addresses.</text>

    <!-- Google OAuth -->
    <rect x="546" y="298" width="348" height="44" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="720" y="325" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13" font-weight="500">G   Continue with Google</text>

    <!-- Divider -->
    <line x1="546" y1="368" x2="692" y2="368" stroke="#DCE0E6"/>
    <text x="720" y="372" text-anchor="middle" fill="#8C969E" font-family="Inter, sans-serif" font-size="11">OR</text>
    <line x1="748" y1="368" x2="894" y2="368" stroke="#DCE0E6"/>

    <!-- Email -->
    <text x="546" y="404" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12" font-weight="500">Email Address</text>
    <rect x="546" y="414" width="348" height="44" rx="2" fill="#FFFFFF" stroke="#C8A96B" stroke-width="1.5"/>
    <text x="560" y="441" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="14">tanvir@example.com</text>

    <!-- Password + Forgot -->
    <text x="546" y="488" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12" font-weight="500">Password</text>
    <text x="894" y="488" text-anchor="end" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="12" text-decoration="underline">Forgot password?</text>
    <rect x="546" y="498" width="348" height="44" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="560" y="525" fill="#8C969E" font-family="Inter, sans-serif" font-size="14">••••••••••</text>

    <!-- Submit -->
    <rect x="546" y="572" width="348" height="46" rx="2" fill="#1F1F1F"/>
    <text x="720" y="600" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="14" font-weight="500">Sign In</text>

