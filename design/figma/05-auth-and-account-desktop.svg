    <text x="80" y="192" fill="#111111" font-family="Inter, sans-serif" font-size="24" font-weight="500">Sign In, Sign Up &amp; Forgot Password</text>

    <!-- Card 1: /login -->
    <g id="Auth-Login-Card">
      <rect x="80" y="220" width="400" height="520" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="112" y="268" fill="#111111" font-family="Inter, sans-serif" font-size="22" font-weight="500">Sign In</text>
      <text x="112" y="292" fill="#525252" font-family="Inter, sans-serif" font-size="13">Access your SHOKH orders &amp; saved BD addresses.</text>

      <!-- Google Button -->
      <rect x="112" y="318" width="336" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="280" y="345" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">G   Continue with Google</text>

      <line x1="112" y1="386" x2="254" y2="386" stroke="#E5E5E5"/>
      <text x="280" y="390" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">OR</text>
      <line x1="306" y1="386" x2="448" y2="386" stroke="#E5E5E5"/>

      <text x="112" y="420" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Email</text>
      <rect x="112" y="430" width="336" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="126" y="457" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">you@example.com</text>

      <text x="112" y="502" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Password</text>
      <text x="448" y="502" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="12" text-decoration="underline">Forgot password?</text>
      <rect x="112" y="512" width="336" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="126" y="539" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">••••••••</text>

      <rect x="112" y="582" width="336" height="44" rx="2" fill="#111111"/>
      <text x="280" y="609" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="500">Sign In</text>

