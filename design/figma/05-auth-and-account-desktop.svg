    <circle cx="1300" cy="68" r="4.5" stroke="#111111" stroke-width="1.5"/>
    <path d="M1291 81C1291 76.5 1295 74 1300 74C1305 74 1309 76.5 1309 81" stroke="#111111" stroke-width="1.5"/>
