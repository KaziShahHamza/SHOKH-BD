    </g>

    <!-- Card 2: /signup -->
    <g id="Auth-Signup-Card">
      <rect x="520" y="220" width="400" height="520" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="552" y="268" fill="#111111" font-family="Inter, sans-serif" font-size="22" font-weight="500">Create Account</text>
      <rect x="552" y="294" width="336" height="42" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="720" y="320" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">G   Continue with Google</text>

      <text x="552" y="366" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Full Name</text>
      <rect x="552" y="374" width="336" height="42" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="566" y="400" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Tanvir Ahmed</text>

      <text x="552" y="442" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">BD Phone</text>
      <rect x="552" y="450" width="336" height="42" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="566" y="476" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="13">01712345678</text>

      <text x="552" y="518" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Email &amp; Password</text>
      <rect x="552" y="526" width="336" height="42" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="566" y="552" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">you@example.com</text>

      <rect x="552" y="582" width="336" height="44" rx="2" fill="#111111"/>
      <text x="720" y="609" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="500">Create Account</text>

      <text x="720" y="660" text-anchor="middle" fill="#525252" font-family="Inter, sans-serif" font-size="13">Already have an account? <tspan fill="#111111" font-weight="500" text-decoration="underline">Sign in</tspan></text>
    </g>

    <!-- Card 3: /forgot-password -->
    <g id="Auth-Forgot-Card">
      <rect x="960" y="220" width="400" height="520" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="992" y="268" fill="#111111" font-family="Inter, sans-serif" font-size="22" font-weight="500">Reset Password</text>
      <text x="992" y="294" fill="#525252" font-family="Inter, sans-serif" font-size="13">Enter your account email and we will send</text>
      <text x="992" y="314" fill="#525252" font-family="Inter, sans-serif" font-size="13">a 30-minute secure reset link.</text>

      <text x="992" y="362" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Account Email</text>
      <rect x="992" y="372" width="336" height="44" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
      <text x="1006" y="399" fill="#111111" font-family="Inter, sans-serif" font-size="13">tanvir@example.com</text>

      <rect x="992" y="440" width="336" height="44" rx="2" fill="#111111"/>
      <text x="1160" y="467" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="500">Send Reset Link</text>

      <rect x="992" y="512" width="336" height="64" rx="2" fill="#F0FDF4"/>
      <text x="1012" y="540" fill="#15803D" font-family="Inter, sans-serif" font-size="12" font-weight="500">✓ Reset email sent</text>
      <text x="1012" y="558" fill="#525252" font-family="Inter, sans-serif" font-size="11">Check your inbox or spam folder.</text>

      <text x="1160" y="660" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-decoration="underline">← Back to Sign In</text>
