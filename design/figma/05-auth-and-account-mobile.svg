    <text x="16" y="128" fill="#D4D4D4" font-family="JetBrains Mono, monospace" font-size="11">support@shokh.bd · +880 1XXX-XXXXXX</text>

    <text x="16" y="176" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">SHOP</text>
