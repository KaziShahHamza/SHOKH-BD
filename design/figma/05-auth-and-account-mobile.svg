    <text x="16" y="248" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Password</text>
    <text x="374" y="248" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="12" text-decoration="underline">Forgot password?</text>
    <rect x="16" y="256" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="28" y="283" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">••••••••</text>

    <rect x="16" y="324" width="358" height="44" rx="2" fill="#111111"/>
    <text x="195" y="351" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="500">Sign In</text>
    <text x="195" y="396" text-anchor="middle" fill="#525252" font-family="Inter, sans-serif" font-size="13">New to SHOKH? <tspan fill="#111111" font-weight="500" text-decoration="underline">Create account</tspan></text>
  </g>

