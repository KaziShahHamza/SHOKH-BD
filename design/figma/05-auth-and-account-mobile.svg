    <text x="32" y="164" fill="#111111" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500">SHK-2026-00412</text>
    <rect x="272" y="146" width="86" height="22" rx="2" fill="#EFF6FF"/>
    <text x="315" y="161" text-anchor="middle" fill="#1D4ED8" font-family="Inter, sans-serif" font-size="9" font-weight="500">CONFIRMED</text>
    <text x="32" y="190" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">26 Nov 2026 · 2 items · COD</text>
    <text x="32" y="218" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="600">৳ 3,640</text>
    <text x="358" y="218" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="12" font-weight="500">Track Order →</text>

    <!-- Order Card 2 -->
    <rect x="16" y="254" width="358" height="104" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="32" y="282" fill="#111111" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500">SHK-2026-00389</text>
    <rect x="272" y="264" width="86" height="22" rx="2" fill="#F0FDF4"/>
    <text x="315" y="279" text-anchor="middle" fill="#15803D" font-family="Inter, sans-serif" font-size="9" font-weight="500">DELIVERED</text>
    <text x="32" y="308" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">12 Nov 2026 · 1 item · COD</text>
    <text x="32" y="336" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="600">৳ 2,450</text>
    <text x="358" y="336" text-anchor="end" fill="#525252" font-family="Inter, sans-serif" font-size="12">Details</text>

    <!-- Saved BD Address -->
    <text x="16" y="400" fill="#111111" font-family="Inter, sans-serif" font-size="16" font-weight="500">Default BD Address</text>
    <rect x="16" y="416" width="358" height="110" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="32" y="444" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">Home — Dhaka Metro (Default)</text>
    <text x="32" y="468" fill="#525252" font-family="Inter, sans-serif" font-size="12">Tanvir Ahmed · 01712345678</text>
    <text x="32" y="488" fill="#525252" font-family="Inter, sans-serif" font-size="12">House 14, Road 6, Dhanmondi, Dhaka</text>
