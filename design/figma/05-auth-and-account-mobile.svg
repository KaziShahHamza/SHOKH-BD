  <!-- 02. MOBILE SIGN IN (/login) -->
  <g id="02-Mobile-Login" transform="translate(0, 116)">
    <text x="16" y="24" fill="#111111" font-family="Inter, sans-serif" font-size="22" font-weight="500">Sign In</text>
    <text x="16" y="46" fill="#525252" font-family="Inter, sans-serif" font-size="13">Access your SHOKH orders &amp; addresses.</text>

    <rect x="16" y="68" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="195" y="95" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">G   Continue with Google</text>

    <line x1="16" y1="136" x2="170" y2="136" stroke="#E5E5E5"/>
    <text x="195" y="140" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">OR</text>
    <line x1="220" y1="136" x2="374" y2="136" stroke="#E5E5E5"/>

    <text x="16" y="170" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Email</text>
    <rect x="16" y="178" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
