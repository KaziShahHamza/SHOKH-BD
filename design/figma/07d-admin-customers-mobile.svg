<svg width="390" height="820" viewBox="0 0 390 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Admin-Customers-Mobile-BG" width="390" height="820" fill="#F7F7F7"/>

  <g id="01-Admin-Mob-Header">
    <rect width="390" height="56" fill="#111111"/>
    <line x1="16" y1="22" x2="34" y2="22" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="16" y1="28" x2="34" y2="28" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="16" y1="34" x2="28" y2="34" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="52" y="33" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2">CUSTOMERS &amp; RISK</text>
  </g>

  <g id="02-Admin-Mob-Search" transform="translate(0, 72)">
    <rect x="16" y="0" width="358" height="40" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="28" y="25" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">Search buyer name or BD phone...</text>
  </g>

  <g id="03-Admin-Mob-Cards" transform="translate(0, 128)">
    <!-- Card 1 -->
    <rect x="16" y="0" width="358" height="118" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="32" y="30" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="500">Tanvir Ahmed</text>
    <text x="32" y="48" fill="#525252" font-family="JetBrains Mono, monospace" font-size="11">01712345678 · Dhaka</text>
    <text x="32" y="76" fill="#525252" font-family="Inter, sans-serif" font-size="12">4 Delivered · 0 Returns</text>
    <text x="32" y="100" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="600">Spent: ৳ 11,420</text>
    <rect x="268" y="76" width="90" height="28" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="313" y="94" text-anchor="middle" fill="#525252" font-family="Inter, sans-serif" font-size="11">Flag Risk</text>

    <!-- Card 2: Flagged -->
    <rect x="16" y="132" width="358" height="118" rx="2" fill="#FEF2F2" stroke="#B91C1C"/>
    <text x="32" y="162" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="500">Rashed Mia (Guest)</text>
    <text x="32" y="180" fill="#B91C1C" font-family="JetBrains Mono, monospace" font-size="11">01911002233 · Gazipur</text>
    <text x="32" y="208" fill="#B91C1C" font-family="Inter, sans-serif" font-size="12" font-weight="500">0 Delivered · 2 Cancel · 2 Return</text>
    <text x="32" y="232" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Spent: ৳ 0</text>
    <rect x="268" y="208" width="90" height="28" rx="2" fill="#B91C1C"/>
    <text x="313" y="226" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="500">⚠ FLAGGED</text>
