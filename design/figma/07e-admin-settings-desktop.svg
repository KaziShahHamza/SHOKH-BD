<svg width="1440" height="940" viewBox="0 0 1440 940" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Admin-Settings-Desktop-BG" width="1440" height="940" fill="#F7F7F7"/>

  <g id="01-Admin-Sidebar">
    <rect width="240" height="940" fill="#111111"/>
    <text x="28" y="46" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">SHOKH</text>
    <text x="28" y="64" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">ADMIN CONSOLE</text>
    <line x1="28" y1="86" x2="212" y2="86" stroke="#2A2A2A"/>

    <text x="32" y="132" fill="#D4D4D4" font-family="Inter, sans-serif" font-size="13">Dashboard Overview</text>
    <text x="32" y="172" fill="#D4D4D4" font-family="Inter, sans-serif" font-size="13">Products &amp; Stock</text>
    <text x="32" y="212" fill="#D4D4D4" font-family="Inter, sans-serif" font-size="13">Orders (COD Pipeline)</text>
    <text x="32" y="252" fill="#D4D4D4" font-family="Inter, sans-serif" font-size="13">Customers &amp; COD Risk</text>
    <rect x="16" y="274" width="208" height="42" rx="2" fill="#FFFFFF"/>
    <text x="32" y="300" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">Store &amp; Delivery Settings</text>
  </g>

  <g id="02-Admin-Topbar">
    <rect x="240" width="1200" height="72" fill="#FFFFFF"/>
    <line x1="240" y1="72" x2="1440" y2="72" stroke="#E5E5E5"/>
    <text x="280" y="44" fill="#111111" font-family="Inter, sans-serif" font-size="20" font-weight="500">Store &amp; Delivery Settings</text>

    <rect x="1216" y="16" width="184" height="40" rx="2" fill="#111111"/>
    <text x="1308" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="500">Save Settings</text>
  </g>

  <g id="03-Settings-Cards" transform="translate(280, 108)">
    <!-- Card 1: Bangladesh Delivery Rates -->
    <rect width="740" height="340" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="32" y="44" fill="#111111" font-family="Inter, sans-serif" font-size="18" font-weight="500">Bangladesh Delivery &amp; COD Rules</text>
    <text x="32" y="68" fill="#525252" font-family="Inter, sans-serif" font-size="13">Live rates applied automatically to Cart Drawer &amp; Checkout.</text>

    <text x="32" y="116" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Inside Dhaka Delivery Fee (BDT ৳) *</text>
    <rect x="32" y="126" width="320" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="46" y="153" fill="#111111" font-family="JetBrains Mono, monospace" font-size="14">70</text>

    <text x="388" y="116" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Outside Dhaka Delivery Fee (BDT ৳) *</text>
    <rect x="388" y="126" width="320" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="402" y="153" fill="#111111" font-family="JetBrains Mono, monospace" font-size="14">130</text>

    <text x="32" y="210" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Free Shipping Threshold (BDT ৳ — leave empty to disable)</text>
    <rect x="32" y="220" width="676" height="44" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="46" y="247" fill="#111111" font-family="JetBrains Mono, monospace" font-size="14">3000</text>

    <text x="32" y="298" fill="#15803D" font-family="Inter, sans-serif" font-size="12">✓ Orders ≥ ৳ 3,000 qualify for Free Nationwide Shipping</text>

    <!-- Card 2: Top Announcement Bar -->
    <rect y="368" width="740" height="220" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="32" y="412" fill="#111111" font-family="Inter, sans-serif" font-size="18" font-weight="500">Storefront Announcement Bar</text>
    <text x="32" y="436" fill="#525252" font-family="Inter, sans-serif" font-size="13">Displayed at the very top of all customer storefront pages.</text>

    <text x="32" y="476" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Announcement Text</text>
    <rect x="32" y="486" width="676" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="46" y="513" fill="#111111" font-family="Inter, sans-serif" font-size="13">NATIONWIDE BANGLADESH DELIVERY · CASH ON DELIVERY · FREE SHIPPING OVER ৳ 3,000</text>

    <rect x="32" y="544" width="160" height="26" rx="2" fill="#F0FDF4"/>
    <text x="112" y="561" text-anchor="middle" fill="#15803D" font-family="Inter, sans-serif" font-size="10" font-weight="500">● ANNOUNCEMENT LIVE</text>
  </g>
</svg>
