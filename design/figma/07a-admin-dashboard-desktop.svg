    <text x="1372" y="668" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="12" font-weight="500">Manage All Stock →</text>

    <rect x="280" y="692" width="1120" height="40" fill="#F7F7F7"/>
    <text x="308" y="717" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500">SKU</text>
    <text x="480" y="717" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500">PRODUCT</text>
    <text x="820" y="717" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500">VARIANT</text>
    <text x="1040" y="717" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500">STOCK</text>
    <text x="1372" y="717" text-anchor="end" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500">ACTION</text>

    <!-- Row 1 -->
    <line x1="280" y1="732" x2="1400" y2="732" stroke="#E5E5E5"/>
    <text x="308" y="772" fill="#111111" font-family="JetBrains Mono, monospace" font-size="12">HBY-GT-01</text>
    <text x="480" y="772" fill="#111111" font-family="Inter, sans-serif" font-size="13">1:64 Diecast Collector GT</text>
    <text x="820" y="772" fill="#525252" font-family="Inter, sans-serif" font-size="13">Matte Silver</text>
    <rect x="1040" y="754" width="76" height="24" rx="2" fill="#FFFBEB"/>
    <text x="1078" y="770" text-anchor="middle" fill="#B45309" font-family="Inter, sans-serif" font-size="10" font-weight="500">2 LEFT</text>
    <rect x="1282" y="750" width="90" height="32" rx="2" fill="#FFFFFF" stroke="#111111"/>
    <text x="1327" y="770" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="12" font-weight="500">Restock +</text>

    <!-- Row 2 -->
    <line x1="280" y1="800" x2="1400" y2="800" stroke="#E5E5E5"/>
    <text x="308" y="840" fill="#111111" font-family="JetBrains Mono, monospace" font-size="12">HBY-CB-03</text>
    <text x="480" y="840" fill="#111111" font-family="Inter, sans-serif" font-size="13">Speedcube Magnetic 3x3 Pro</text>
    <text x="820" y="840" fill="#525252" font-family="Inter, sans-serif" font-size="13">Stickerless</text>
    <rect x="1040" y="822" width="76" height="24" rx="2" fill="#FEF2F2"/>
    <text x="1078" y="838" text-anchor="middle" fill="#B91C1C" font-family="Inter, sans-serif" font-size="10" font-weight="500">0 LEFT</text>
    <rect x="1282" y="818" width="90" height="32" rx="2" fill="#111111"/>
    <text x="1327" y="838" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="500">Restock +</text>

    <!-- Row 3 -->
    <line x1="280" y1="868" x2="1400" y2="868" stroke="#E5E5E5"/>
    <text x="308" y="908" fill="#111111" font-family="JetBrains Mono, monospace" font-size="12">TSH-BLK-L</text>
    <text x="480" y="908" fill="#111111" font-family="Inter, sans-serif" font-size="13">Heavyweight Boxy Tee</text>
    <text x="820" y="908" fill="#525252" font-family="Inter, sans-serif" font-size="13">Charcoal / L</text>
    <rect x="1040" y="890" width="76" height="24" rx="2" fill="#FFFBEB"/>
    <text x="1078" y="906" text-anchor="middle" fill="#B45309" font-family="Inter, sans-serif" font-size="10" font-weight="500">4 LEFT</text>
    <rect x="1282" y="886" width="90" height="32" rx="2" fill="#FFFFFF" stroke="#111111"/>
    <text x="1327" y="906" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="12" font-weight="500">Restock +</text>
  </g>
</svg>
