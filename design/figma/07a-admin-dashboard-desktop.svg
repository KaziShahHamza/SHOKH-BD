<svg width="1440" height="1060" viewBox="0 0 1440 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Admin-Dashboard-Desktop-BG" width="1440" height="1060" fill="#F7F7F7"/>

  <!-- 01. ADMIN SIDEBAR (240px) -->
  <g id="01-Admin-Sidebar">
    <rect width="240" height="1060" fill="#111111"/>
    <text x="28" y="46" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">SHOKH</text>
    <text x="28" y="64" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">ADMIN CONSOLE</text>
    <line x1="28" y1="86" x2="212" y2="86" stroke="#2A2A2A"/>

    <rect x="16" y="106" width="208" height="42" rx="2" fill="#FFFFFF"/>
    <text x="32" y="132" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">Dashboard Overview</text>

    <text x="32" y="182" fill="#D4D4D4" font-family="Inter, sans-serif" font-size="13">Products &amp; Stock</text>
    <text x="32" y="222" fill="#D4D4D4" font-family="Inter, sans-serif" font-size="13">Orders (COD Pipeline)</text>
    <rect x="176" y="207" width="32" height="20" rx="2" fill="#2A2A2A"/>
    <text x="192" y="221" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="10">11</text>

    <line x1="28" y1="960" x2="212" y2="960" stroke="#2A2A2A"/>
    <text x="28" y="994" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">View Live Store ↗</text>
    <text x="28" y="1022" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">Sign Out</text>
  </g>

  <!-- 02. TOP BAR -->
  <g id="02-Admin-Topbar">
    <rect x="240" width="1200" height="72" fill="#FFFFFF"/>
    <line x1="240" y1="72" x2="1440" y2="72" stroke="#E5E5E5"/>
    <text x="280" y="44" fill="#111111" font-family="Inter, sans-serif" font-size="20" font-weight="500">Dashboard Overview</text>

    <rect x="1040" y="16" width="160" height="40" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="1056" y="41" fill="#111111" font-family="Inter, sans-serif" font-size="13">Last 30 Days</text>
    <text x="1184" y="41" text-anchor="end" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">▾</text>

    <rect x="1216" y="16" width="184" height="40" rx="2" fill="#111111"/>
    <text x="1308" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="500">+ Add Product</text>
  </g>

  <!-- 03. KPI CARDS (4 COLS) -->
  <g id="03-Admin-KPIs">
    <rect x="280" y="104" width="265" height="118" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="304" y="136" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="0.8">TOTAL INCOME (BDT)</text>
    <text x="304" y="176" fill="#111111" font-family="Inter, sans-serif" font-size="28" font-weight="600">৳ 1,84,500</text>
    <text x="304" y="202" fill="#15803D" font-family="Inter, sans-serif" font-size="12">+18.4% vs last 30 days</text>

    <rect x="565" y="104" width="265" height="118" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="589" y="136" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="0.8">TOTAL SALES</text>
    <text x="589" y="176" fill="#111111" font-family="Inter, sans-serif" font-size="28" font-weight="600">96 Orders</text>
    <text x="589" y="202" fill="#525252" font-family="Inter, sans-serif" font-size="12">Avg order: ৳ 1,922</text>

    <rect x="850" y="104" width="265" height="118" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="874" y="136" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="0.8">DELIVERED ORDERS</text>
    <text x="874" y="176" fill="#15803D" font-family="Inter, sans-serif" font-size="28" font-weight="600">74</text>
    <text x="874" y="202" fill="#15803D" font-family="Inter, sans-serif" font-size="12">77.1% completion rate</text>

    <rect x="1135" y="104" width="265" height="118" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="1159" y="136" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="0.8">CANCELLED ORDERS</text>
    <text x="1159" y="176" fill="#B91C1C" font-family="Inter, sans-serif" font-size="28" font-weight="600">5</text>
    <text x="1159" y="202" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">5.2% cancellation rate</text>
  </g>

  <!-- 04. ANALYTICS CHARTS -->
  <g id="04-Analytics-Charts">
    <!-- Left Chart: Income & Sales Trend -->
    <rect x="280" y="246" width="680" height="360" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="308" y="284" fill="#111111" font-family="Inter, sans-serif" font-size="16" font-weight="500">Income &amp; Sales Trend (BDT)</text>
    <text x="932" y="284" text-anchor="end" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="11">DAILY REVENUE</text>

    <line x1="308" y1="340" x2="932" y2="340" stroke="#F1F1F1"/>
    <line x1="308" y1="400" x2="932" y2="400" stroke="#F1F1F1"/>
    <line x1="308" y1="460" x2="932" y2="460" stroke="#F1F1F1"/>
    <line x1="308" y1="520" x2="932" y2="520" stroke="#E5E5E5"/>

    <polyline points="320,490 400,450 480,468 560,410 640,428 720,360 800,380 880,330 924,342" stroke="#111111" stroke-width="2.5" fill="none"/>
    <circle cx="720" cy="360" r="4" fill="#111111"/>
    <circle cx="880" cy="330" r="4" fill="#111111"/>

    <text x="320" y="556" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">01 NOV</text>
    <text x="560" y="556" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">10 NOV</text>
    <text x="720" y="556" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">18 NOV</text>
    <text x="900" y="556" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">26 NOV</text>

    <!-- Right Chart: Order Status Breakdown -->
    <rect x="980" y="246" width="420" height="360" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="1008" y="284" fill="#111111" font-family="Inter, sans-serif" font-size="16" font-weight="500">Order Status Breakdown</text>

    <text x="1008" y="336" fill="#525252" font-family="Inter, sans-serif" font-size="13">Delivered (74)</text>
    <rect x="1008" y="346" width="364" height="12" rx="2" fill="#F1F1F1"/>
    <rect x="1008" y="346" width="280" height="12" rx="2" fill="#15803D"/>

    <text x="1008" y="392" fill="#525252" font-family="Inter, sans-serif" font-size="13">Pending (11)</text>
    <rect x="1008" y="402" width="364" height="12" rx="2" fill="#F1F1F1"/>
    <rect x="1008" y="402" width="64" height="12" rx="2" fill="#B45309"/>

    <text x="1008" y="448" fill="#525252" font-family="Inter, sans-serif" font-size="13">Shipped (8)</text>
    <rect x="1008" y="458" width="364" height="12" rx="2" fill="#F1F1F1"/>
    <rect x="1008" y="458" width="48" height="12" rx="2" fill="#111111"/>

    <text x="1008" y="504" fill="#525252" font-family="Inter, sans-serif" font-size="13">Confirmed (6)</text>
    <rect x="1008" y="514" width="364" height="12" rx="2" fill="#F1F1F1"/>
    <rect x="1008" y="514" width="36" height="12" rx="2" fill="#1D4ED8"/>

    <text x="1008" y="560" fill="#525252" font-family="Inter, sans-serif" font-size="13">Cancelled (5)</text>
    <rect x="1008" y="570" width="364" height="12" rx="2" fill="#F1F1F1"/>
    <rect x="1008" y="570" width="28" height="12" rx="2" fill="#B91C1C"/>
  </g>

  <!-- 05. LOW STOCK ALERTS TABLE -->
