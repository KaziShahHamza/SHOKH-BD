<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Product-Detail-Section-BG" width="1280" height="820" fill="#F8F9FA"/>

  <!-- LEFT: MAIN IMAGE + 4 THUMBNAILS BELOW -->
  <g id="01-Product-Gallery-Bottom-Thumbs">
    <!-- Main Product Image Frame -->
    <rect id="IMG-Product-Main" x="0" y="0" width="640" height="620" rx="2" fill="#EEF0F3" stroke="#DCE0E6"/>
    <text x="320" y="314" text-anchor="middle" fill="#6E7C7C" font-family="JetBrains Mono, monospace" font-size="12">MAIN PRODUCT IMAGE FRAME (640 × 620)</text>

    <!-- 4 Small Thumbnails Below Main Image -->
    <rect id="IMG-Thumb-1" x="0" y="636" width="148" height="148" rx="2" fill="#EEF0F3" stroke="#C8A96B" stroke-width="2"/>
    <rect id="IMG-Thumb-2" x="164" y="636" width="148" height="148" rx="2" fill="#EEF0F3" stroke="#DCE0E6"/>
    <rect id="IMG-Thumb-3" x="328" y="636" width="148" height="148" rx="2" fill="#EEF0F3" stroke="#DCE0E6"/>
    <rect id="IMG-Thumb-Video" x="492" y="636" width="148" height="148" rx="2" fill="#1F1F1F"/>
    <polygon points="560,692 580,704 560,716" fill="#C8A96B"/>
    <text x="566" y="742" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="10" font-weight="500" letter-spacing="0.8">VIDEO</text>
  </g>

  <!-- RIGHT: PURCHASE PANEL (MINIMAL LUXE) -->
  <g id="02-Purchase-Panel" transform="translate(688, 0)">
    <text x="0" y="18" fill="#6E7C7C" font-family="JetBrains Mono, monospace" font-size="11">WATCHES  ·  SKU: WTC-BLK-40</text>
    <rect x="504" y="0" width="88" height="24" rx="2" fill="#F0FDF4"/>
    <text x="548" y="16" text-anchor="middle" fill="#15803D" font-family="Inter, sans-serif" font-size="10" font-weight="600">IN STOCK</text>

    <text x="0" y="62" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="30" font-weight="500" letter-spacing="-0.6">Minimalist Matte Chrono 40mm</text>
    <text x="0" y="106" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="24" font-weight="600">৳ 2,450</text>
    <text x="108" y="106" fill="#8C969E" font-family="Inter, sans-serif" font-size="16" text-decoration="line-through">৳ 2,900</text>
    <rect x="174" y="88" width="48" height="22" rx="2" fill="#C8A96B"/>
    <text x="198" y="103" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="11" font-weight="600">-15%</text>

    <text x="0" y="144" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="14">Brushed 316L stainless steel case with Japanese quartz movement</text>
    <text x="0" y="166" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="14">and sapphire-coated mineral glass. Built for everyday wear.</text>

    <line x1="0" y1="194" x2="592" y2="194" stroke="#DCE0E6"/>

    <!-- Strap Edition Selector -->
    <text x="0" y="224" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="12" font-weight="500">STRAP EDITION: Matte Steel</text>
    <rect x="0" y="240" width="120" height="40" rx="2" fill="#1F1F1F" stroke="#C8A96B" stroke-width="1.5"/>
    <text x="60" y="265" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="13" font-weight="500">Matte Steel</text>
    <rect x="132" y="240" width="126" height="40" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="195" y="265" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">Black Leather</text>
    <rect x="270" y="240" width="116" height="40" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="328" y="265" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">Nylon Olive</text>

    <!-- Dial Color Swatches -->
    <text x="0" y="318" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="12" font-weight="500">DIAL COLOR: Obsidian Black</text>
    <circle cx="16" cy="348" r="15" stroke="#C8A96B" stroke-width="2"/>
    <circle cx="16" cy="348" r="11" fill="#1F1F1F"/>
    <circle cx="58" cy="348" r="12" fill="#CBD2D9"/>
    <circle cx="100" cy="348" r="12" fill="#EEF0F3" stroke="#CBD2D9"/>

    <!-- Quantity + Add to Bag (Brushed Gold) -->
    <rect x="0" y="392" width="124" height="48" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="22" y="422" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="16">−</text>
    <text x="62" y="421" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="14" font-weight="500">1</text>
    <text x="102" y="422" text-anchor="end" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="16">+</text>

    <rect x="136" y="392" width="456" height="48" rx="2" fill="#C8A96B"/>
    <text x="364" y="421" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="14" font-weight="600">Add to Bag</text>

    <!-- Primary COD CTA -->
    <rect x="0" y="454" width="592" height="50" rx="2" fill="#1F1F1F"/>
    <text x="296" y="484" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="14" font-weight="500">Order Now — Cash on Delivery</text>

    <!-- COD Delivery Info Card -->
    <rect x="0" y="524" width="592" height="72" rx="2" fill="#EEF0F3" stroke="#DCE0E6"/>
    <text x="20" y="552" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13" font-weight="500">Nationwide Bangladesh Delivery (COD)</text>
    <text x="20" y="574" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12">Inside Dhaka: ৳ 70 (1–2 days) · Outside Dhaka: ৳ 130 (2–4 days) · Free over ৳ 3,000</text>

    <!-- Accordions -->
    <line x1="0" y1="628" x2="592" y2="628" stroke="#DCE0E6"/>
    <text x="0" y="660" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="14" font-weight="500">Specifications</text>
    <text x="580" y="660" text-anchor="end" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="16">−</text>
    <text x="0" y="688" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="13">Case: 40mm 316L Steel · Movement: Miyota Quartz · Water Resistance: 3ATM</text>

    <line x1="0" y1="714" x2="592" y2="714" stroke="#DCE0E6"/>
    <text x="0" y="746" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="14" font-weight="500">Delivery &amp; Return Policy</text>
    <text x="580" y="746" text-anchor="end" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="16">+</text>
    <line x1="0" y1="774" x2="592" y2="774" stroke="#DCE0E6"/>
  </g>
</svg>
