    <text x="94" y="531" fill="#111111" font-family="Inter, sans-serif" font-size="14">Dhaka</text>
    <text x="414" y="531" text-anchor="end" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">▾</text>

    <text x="450" y="494" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">District *</text>
