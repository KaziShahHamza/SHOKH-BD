<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Cart-Overlay-BG" width="1440" height="900" fill="#FFFFFF"/>

  <!-- DIMMED STOREFRONT CONTEXT (LEFT) -->
  <g id="01-Storefront-Backdrop" opacity="0.4">
    <rect width="1440" height="36" fill="#111111"/>
    <rect y="36" width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="108" x2="1440" y2="108" stroke="#E5E5E5"/>
    <text x="80" y="79" fill="#111111" font-family="Inter, sans-serif" font-size="22" font-weight="600" letter-spacing="1.8">SHOKH</text>
    <rect x="80" y="160" width="840" height="580" rx="2" fill="#F7F7F7"/>
  </g>
  <rect width="1000" height="900" fill="#111111" fill-opacity="0.35"/>

  <!-- 02. SLIDE-OVER CART DRAWER (440px WIDE, RIGHT DOCKED) -->
  <g id="02-Cart-Drawer-Desktop" transform="translate(1000, 0)">
    <rect width="440" height="900" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="0" y2="900" stroke="#111111"/>

    <!-- Drawer Header -->
    <text x="28" y="44" fill="#111111" font-family="Inter, sans-serif" font-size="18" font-weight="500">Your Bag (2)</text>
    <text x="412" y="44" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="18">✕</text>
    <line x1="0" y1="68" x2="440" y2="68" stroke="#E5E5E5"/>

    <!-- Free Shipping Progress Banner -->
    <rect x="28" y="88" width="384" height="40" rx="2" fill="#F0FDF4"/>
    <text x="220" y="113" text-anchor="middle" fill="#15803D" font-family="Inter, sans-serif" font-size="12" font-weight="500">✓ You unlocked Free Nationwide Shipping</text>

    <!-- Cart Item 1 -->
    <rect id="IMG-Cart-1" x="28" y="152" width="76" height="96" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="120" y="174" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="500">Matte Chrono 40mm</text>
    <text x="120" y="194" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">Matte Steel · WTC-BLK-40</text>
    <text x="412" y="174" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="500">৳ 2,450</text>
    <rect x="120" y="216" width="88" height="30" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="164" y="236" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="12">−   1   +</text>
    <text x="412" y="236" text-anchor="end" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" text-decoration="underline">Remove</text>

    <line x1="28" y1="272" x2="412" y2="272" stroke="#E5E5E5"/>

    <!-- Cart Item 2 -->
    <rect id="IMG-Cart-2" x="28" y="296" width="76" height="96" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="120" y="318" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="500">Square UV400 Frame</text>
    <text x="120" y="338" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">Matte Black · GLS-SQ-01</text>
    <text x="412" y="318" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="500">৳ 1,190</text>
    <rect x="120" y="360" width="88" height="30" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="164" y="380" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="12">−   1   +</text>
    <text x="412" y="380" text-anchor="end" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" text-decoration="underline">Remove</text>

    <!-- Drawer Bottom Checkout Dock -->
    <rect y="692" width="440" height="208" fill="#FFFFFF"/>
    <line x1="0" y1="692" x2="440" y2="692" stroke="#E5E5E5"/>
    <text x="28" y="732" fill="#525252" font-family="Inter, sans-serif" font-size="14">Subtotal</text>
    <text x="412" y="732" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="20" font-weight="600">৳ 3,640</text>
    <text x="28" y="758" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="12">Inside Dhaka ৳ 70 · Outside Dhaka ৳ 130 at checkout</text>

    <rect x="28" y="782" width="384" height="48" rx="2" fill="#111111"/>
    <text x="220" y="811" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="500">Proceed to Checkout →</text>

    <text x="220" y="864" text-anchor="middle" fill="#525252" font-family="Inter, sans-serif" font-size="12" text-decoration="underline">Continue Shopping</text>
  </g>
</svg>
