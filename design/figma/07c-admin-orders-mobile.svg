    <text x="32" y="490" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="600">৳ 1,780</text>
    <text x="358" y="490" text-anchor="end" fill="#525252" font-family="Inter, sans-serif" font-size="12">View</text>
