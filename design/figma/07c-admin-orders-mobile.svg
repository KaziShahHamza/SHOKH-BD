<svg width="390" height="1060" viewBox="0 0 390 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Admin-Orders-Mobile-BG" width="390" height="1060" fill="#F7F7F7"/>

  <g id="01-Admin-Mob-Header">
