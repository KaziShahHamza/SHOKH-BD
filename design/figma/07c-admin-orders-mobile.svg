    <rect x="90" y="52" width="88" height="32" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="134" y="72" text-anchor="middle" fill="#B45309" font-family="Inter, sans-serif" font-size="11" font-weight="500">Pending (11)</text>
    <rect x="186" y="52" width="96" height="32" rx="2" fill="#FFFFFF" stroke="#E5E5E5"/>
