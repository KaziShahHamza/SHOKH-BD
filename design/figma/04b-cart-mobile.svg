    <text x="16" y="256" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Glasses</text>
    <text x="16" y="282" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">T-Shirts · Gift</text>

