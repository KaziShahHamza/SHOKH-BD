<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Cart-Mobile-Overlay-BG" width="390" height="844" fill="#111111" fill-opacity="0.4"/>

  <!-- SLIDE-OVER CART DRAWER (356px WIDE, RIGHT DOCKED) -->
  <g id="01-Mobile-Cart-Drawer" transform="translate(34, 0)">
    <rect width="356" height="844" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="0" y2="844" stroke="#111111"/>

    <!-- Header -->
    <text x="20" y="38" fill="#111111" font-family="Inter, sans-serif" font-size="16" font-weight="500">Your Bag (2)</text>
    <text x="336" y="38" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="16">✕</text>
    <line x1="0" y1="58" x2="356" y2="58" stroke="#E5E5E5"/>

    <!-- Free Shipping Banner -->
    <rect x="20" y="76" width="316" height="34" rx="2" fill="#F0FDF4"/>
    <text x="178" y="97" text-anchor="middle" fill="#15803D" font-family="Inter, sans-serif" font-size="11" font-weight="500">✓ Free Nationwide Shipping Unlocked</text>

    <!-- Item 1 -->
    <rect id="IMG-Mob-Cart-1" x="20" y="130" width="68" height="84" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="102" y="150" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">Matte Chrono 40mm</text>
    <text x="102" y="168" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">Matte Steel</text>
    <text x="336" y="150" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">৳ 2,450</text>
    <rect x="102" y="186" width="80" height="28" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="142" y="204" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="12">−  1  +</text>
    <text x="336" y="204" text-anchor="end" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="10" text-decoration="underline">Remove</text>

    <line x1="20" y1="234" x2="336" y2="234" stroke="#E5E5E5"/>

    <!-- Item 2 -->
    <rect id="IMG-Mob-Cart-2" x="20" y="254" width="68" height="84" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="102" y="274" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">Square UV400 Frame</text>
    <text x="102" y="292" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">Matte Black</text>
    <text x="336" y="274" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">৳ 1,190</text>
    <rect x="102" y="310" width="80" height="28" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="142" y="328" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="12">−  1  +</text>
    <text x="336" y="328" text-anchor="end" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="10" text-decoration="underline">Remove</text>

    <!-- Bottom Checkout Dock -->
    <rect y="656" width="356" height="188" fill="#FFFFFF"/>
    <line x1="0" y1="656" x2="356" y2="656" stroke="#E5E5E5"/>
    <text x="20" y="692" fill="#525252" font-family="Inter, sans-serif" font-size="13">Subtotal</text>
    <text x="336" y="692" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="18" font-weight="600">৳ 3,640</text>
    <text x="20" y="714" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">COD · Delivery calculated at checkout</text>

    <rect x="20" y="734" width="316" height="46" rx="2" fill="#111111"/>
    <text x="178" y="762" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="500">Proceed to Checkout →</text>
    <text x="178" y="810" text-anchor="middle" fill="#525252" font-family="Inter, sans-serif" font-size="11" text-decoration="underline">Continue Shopping</text>
  </g>
</svg>
