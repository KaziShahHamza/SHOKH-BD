  <g id="05-Mobile-Order-Tracking" transform="translate(0, 1072)">
    <line x1="0" y1="0" x2="390" y2="0" stroke="#E5E5E5"/>
    <rect x="16" y="28" width="96" height="24" rx="2" fill="#F0FDF4"/>
    <text x="64" y="44" text-anchor="middle" fill="#15803D" font-family="Inter, sans-serif" font-size="10" font-weight="500">✓ CONFIRMED</text>
    <text x="16" y="80" fill="#111111" font-family="Inter, sans-serif" font-size="20" font-weight="500">Order SHK-2026-00412</text>

    <!-- Timeline -->
    <line x1="36" y1="120" x2="354" y2="120" stroke="#E5E5E5" stroke-width="2"/>
    <line x1="36" y1="120" x2="142" y2="120" stroke="#111111" stroke-width="2"/>
    <circle cx="36" cy="120" r="7" fill="#111111"/>
    <text x="36" y="146" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="10">Pending</text>
    <circle cx="142" cy="120" r="7" fill="#1D4ED8"/>
    <text x="142" y="146" text-anchor="middle" fill="#1D4ED8" font-family="Inter, sans-serif" font-size="10" font-weight="500">Confirmed</text>
    <circle cx="248" cy="120" r="7" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
    <text x="248" y="146" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="10">Shipped</text>
    <circle cx="354" cy="120" r="7" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
    <text x="354" y="146" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="10">Delivered</text>

    <rect x="16" y="176" width="358" height="96" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="30" y="204" fill="#111111" font-family="Inter, sans-serif" font-size="12" font-weight="500">Tanvir Ahmed · 01712345678</text>
    <text x="30" y="224" fill="#525252" font-family="Inter, sans-serif" font-size="12">House 14, Road 6, Dhanmondi, Dhaka</text>
    <text x="30" y="252" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="600">COD Payable: ৳ 3,640</text>
  </g>

  <!-- 06. MOBILE FOOTER -->
