<svg width="390" height="2400" viewBox="0 0 390 2400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Checkout-Mobile-BG" width="390" height="2400" fill="#FFFFFF"/>

  <!-- 01. ANNOUNCEMENT BAR -->
