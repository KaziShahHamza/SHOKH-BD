    <text x="195" y="20" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="500" letter-spacing="1">NATIONWIDE BD DELIVERY · CASH ON DELIVERY</text>
  </g>

  <!-- 02. MOBILE NAVBAR -->
  <g id="02-Mobile-Navbar">
    <rect y="32" width="390" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="88" x2="390" y2="88" stroke="#E5E5E5"/>
    <line x1="16" y1="54" x2="34" y2="54" stroke="#111111" stroke-width="1.5"/>
    <line x1="16" y1="60" x2="34" y2="60" stroke="#111111" stroke-width="1.5"/>
    <line x1="16" y1="66" x2="28" y2="66" stroke="#111111" stroke-width="1.5"/>
    <text x="195" y="66" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="1.6">SHOKH</text>
    <circle cx="326" cy="59" r="6" stroke="#111111" stroke-width="1.5"/>
    <line x1="330" y1="63" x2="334" y2="67" stroke="#111111" stroke-width="1.5"/>
    <rect x="352" y="53" width="15" height="14" rx="1.5" stroke="#111111" stroke-width="1.5"/>
    <circle cx="370" cy="51" r="7" fill="#111111"/>
    <text x="370" y="54.5" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="9" font-weight="500">2</text>
  </g>

  <!-- 03. COLLAPSIBLE ORDER SUMMARY BAR -->
