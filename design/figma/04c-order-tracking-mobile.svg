    <text x="318" y="162" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="10">Delivered</text>

    <!-- Address & COD -->
    <rect x="20" y="190" width="318" height="106" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="34" y="218" fill="#111111" font-family="Inter, sans-serif" font-size="12" font-weight="500">Tanvir Ahmed · 01712345678</text>
    <text x="34" y="238" fill="#525252" font-family="Inter, sans-serif" font-size="12">House 14, Road 6, Dhanmondi, Dhaka</text>
    <text x="34" y="268" fill="#111111" font-family="Inter, sans-serif" font-size="14" font-weight="600">COD Payable: ৳ 3,640</text>
    <text x="324" y="268" text-anchor="end" fill="#15803D" font-family="Inter, sans-serif" font-size="11">Free Delivery</text>

    <!-- Items -->
