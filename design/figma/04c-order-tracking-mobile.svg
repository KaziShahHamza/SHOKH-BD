    <text x="20" y="76" fill="#111111" font-family="Inter, sans-serif" font-size="20" font-weight="500">Order SHK-2026-00412</text>
    <text x="20" y="96" fill="#525252" font-family="JetBrains Mono, monospace" font-size="11">COD · Est. 1–2 business days</text>

