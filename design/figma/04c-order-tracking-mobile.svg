    <text x="20" y="34" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">GUEST ORDER TRACKING</text>
    <text x="20" y="62" fill="#111111" font-family="Inter, sans-serif" font-size="22" font-weight="500">Track Your Order</text>

    <text x="20" y="96" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Order Number *</text>
    <rect x="20" y="104" width="318" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="32" y="131" fill="#111111" font-family="JetBrains Mono, monospace" font-size="13">SHK-2026-00412</text>

    <text x="20" y="172" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">BD Phone Number *</text>
