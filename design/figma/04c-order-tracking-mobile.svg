    <rect x="20" y="438" width="318" height="44" rx="2" fill="#111111"/>
    <text x="179" y="465" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="500">Continue Shopping</text>
    <text x="179" y="512" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">Need help? support@shokh.bd</text>
