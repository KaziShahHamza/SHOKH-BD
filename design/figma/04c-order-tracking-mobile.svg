    <line x1="40" y1="136" x2="318" y2="136" stroke="#E5E5E5" stroke-width="2"/>
    <line x1="40" y1="136" x2="134" y2="136" stroke="#111111" stroke-width="2"/>
    <circle cx="40" cy="136" r="7" fill="#111111"/>
    <text x="40" y="162" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="10">Pending</text>
