    <rect width="390" height="520" fill="#111111"/>
    <text x="16" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">SHOKH</text>
    <text x="16" y="76" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Minimalist everyday objects &amp; hobby goods</text>
    <text x="16" y="96" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">curated for Bangladesh.</text>
    <text x="16" y="128" fill="#D4D4D4" font-family="JetBrains Mono, monospace" font-size="11">support@shokh.bd · +880 1XXX-XXXXXX</text>

    <text x="16" y="176" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">SHOP</text>
    <text x="16" y="204" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">All Products</text>
    <text x="16" y="230" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Watches</text>
    <text x="16" y="256" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Glasses</text>
    <text x="16" y="282" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Crocs · T-Shirts · Hobby</text>

    <text x="210" y="176" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">SUPPORT</text>
    <text x="210" y="204" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Track Order</text>
    <text x="210" y="230" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Delivery &amp; COD</text>
    <text x="210" y="256" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">7-Day Exchange</text>
    <text x="210" y="282" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Sign In / Account</text>

    <rect x="16" y="330" width="358" height="36" rx="2" fill="#1F1F1F" stroke="#2A2A2A"/>
    <text x="195" y="352" text-anchor="middle" fill="#D4D4D4" font-family="JetBrains Mono, monospace" font-size="11">COD NATIONWIDE · DHAKA ৳ 70 · OUTSIDE ৳ 130</text>
    <text x="16" y="400" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="500">Instagram  ·  Facebook  ·  YouTube</text>

    <line x1="16" y1="432" x2="374" y2="432" stroke="#2A2A2A"/>
    <text x="16" y="466" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">© 2026 SHOKH Bangladesh. All rights reserved.</text>
    <text x="16" y="486" fill="#525252" font-family="Inter, sans-serif" font-size="11">Privacy Policy · Terms · BDT (৳)</text>
  </g>
</svg>
