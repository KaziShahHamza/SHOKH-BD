<svg width="390" height="1280" viewBox="0 0 390 1280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Signup-Mobile-BG" width="390" height="1280" fill="#F8F9FA"/>

  <!-- 01. MOBILE NAVBAR -->
  <g id="01-Mobile-Navbar">
    <rect width="390" height="32" fill="#1F1F1F"/>
    <text x="195" y="20" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="10" font-weight="500" letter-spacing="1">NATIONWIDE BD DELIVERY · CASH ON DELIVERY</text>
    <rect y="32" width="390" height="56" fill="#F8F9FA"/>
    <line x1="0" y1="88" x2="390" y2="88" stroke="#DCE0E6"/>
    <line x1="16" y1="54" x2="34" y2="54" stroke="#1F1F1F" stroke-width="1.5"/>
    <line x1="16" y1="60" x2="34" y2="60" stroke="#1F1F1F" stroke-width="1.5"/>
    <line x1="16" y1="66" x2="28" y2="66" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="195" y="66" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="1.6">SHOKH</text>
    <circle cx="326" cy="59" r="6" stroke="#1F1F1F" stroke-width="1.5"/>
    <line x1="330" y1="63" x2="334" y2="67" stroke="#1F1F1F" stroke-width="1.5"/>
    <rect x="352" y="53" width="15" height="14" rx="1.5" stroke="#1F1F1F" stroke-width="1.5"/>
    <circle cx="370" cy="51" r="7" fill="#C8A96B"/>
    <text x="370" y="54.5" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="9" font-weight="700">2</text>
  </g>

  <!-- 02. MOBILE SIGNUP FORM (/signup) -->
  <g id="02-Mobile-Signup" transform="translate(0, 124)">
    <text x="16" y="24" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="24" font-weight="500">Create Account</text>
    <text x="16" y="48" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="13">Save BD addresses &amp; track COD orders.</text>

    <rect x="16" y="76" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="195" y="103" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13" font-weight="500">G   Continue with Google</text>

    <line x1="16" y1="144" x2="170" y2="144" stroke="#DCE0E6"/>
    <text x="195" y="148" text-anchor="middle" fill="#8C969E" font-family="Inter, sans-serif" font-size="11">OR</text>
    <line x1="220" y1="144" x2="374" y2="144" stroke="#DCE0E6"/>

    <text x="16" y="178" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12" font-weight="500">Full Name *</text>
    <rect x="16" y="186" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#C8A96B" stroke-width="1.5"/>
    <text x="28" y="213" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="13">Tanvir Ahmed</text>

    <text x="16" y="256" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12" font-weight="500">BD Phone Number *</text>
    <rect x="16" y="264" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="28" y="291" fill="#8C969E" font-family="JetBrains Mono, monospace" font-size="13">01712345678</text>

    <text x="16" y="334" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12" font-weight="500">Email Address *</text>
    <rect x="16" y="342" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="28" y="369" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">tanvir@example.com</text>

    <text x="16" y="412" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12" font-weight="500">Password *</text>
    <rect x="16" y="420" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#CBD2D9"/>
    <text x="28" y="447" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Minimum 8 characters</text>

    <rect x="16" y="488" width="358" height="46" rx="2" fill="#1F1F1F"/>
    <text x="195" y="516" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="14" font-weight="500">Create Account</text>

    <text x="195" y="564" text-anchor="middle" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="13">Already have an account? <tspan fill="#1F1F1F" font-weight="500" text-decoration="underline">Sign in</tspan></text>
  </g>

