    <text x="16" y="76" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Minimalist everyday objects &amp; gift goods</text>
    <text x="16" y="96" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">curated for Bangladesh.</text>
    <text x="16" y="128" fill="#CBD2D9" font-family="JetBrains Mono, monospace" font-size="11">support@shokh.bd · +880 1XXX-XXXXXX</text>

    <text x="16" y="176" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">SHOP</text>
    <text x="16" y="204" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">All Products</text>
    <text x="16" y="230" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Watches</text>
    <text x="16" y="256" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Glasses</text>
    <text x="16" y="282" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">T-Shirts · Gifts</text>

    <text x="210" y="176" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">SUPPORT</text>
    <text x="210" y="204" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Track Order</text>
    <text x="210" y="230" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Delivery &amp; COD</text>
    <text x="210" y="256" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">7-Day Exchange</text>
    <text x="210" y="282" fill="#8C969E" font-family="Inter, sans-serif" font-size="13">Sign In / Account</text>

    <text x="16" y="336" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="12" font-weight="500">Instagram  ·  Facebook  ·  YouTube</text>

    <line x1="16" y1="372" x2="374" y2="372" stroke="#2A2A2A"/>
    <text x="16" y="406" fill="#8C969E" font-family="Inter, sans-serif" font-size="11">© 2026 SHOKH Bangladesh. All rights reserved.</text>
    <text x="16" y="428" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="11">Privacy Policy · Terms · BDT (৳)</text>
  </g>
</svg>
