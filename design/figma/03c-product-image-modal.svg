<svg width="1960" height="980" viewBox="0 0 1960 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1960" height="980" fill="#EEF0F3"/>
  <text x="40" y="34" fill="#6E7C7C" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500">PRODUCT IMAGE LIGHTBOX &amp; ZOOM MODAL — DESKTOP (1440×900) + MOBILE (390×844)</text>

  <!-- ========================================================= -->
  <!-- 1. DESKTOP IMAGE ZOOM MODAL (1440 x 900)                  -->
  <!-- ========================================================= -->
  <g id="01-Desktop-Image-Zoom-Modal" transform="translate(40, 52)">
    <rect width="1440" height="900" rx="2" fill="#1F1F1F" fill-opacity="0.94"/>

    <!-- Top Modal Toolbar -->
    <text x="40" y="46" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="14" font-weight="500">Minimalist Matte Chrono 40mm  ·  Obsidian Black</text>
    <rect x="400" y="28" width="54" height="24" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <text x="427" y="44" text-anchor="middle" fill="#C8A96B" font-family="JetBrains Mono, monospace" font-size="11">1 / 4</text>

    <!-- Zoom Controls: Zoom Out (-), Level (150%), Zoom In (+), Reset, Close (✕) -->
    <rect x="1084" y="22" width="38" height="36" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <text x="1103" y="46" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="18">−</text>

    <rect x="1128" y="22" width="64" height="36" rx="2" fill="#2A2A2A" stroke="#C8A96B"/>
    <text x="1160" y="45" text-anchor="middle" fill="#C8A96B" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">150%</text>

    <rect x="1198" y="22" width="38" height="36" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <text x="1217" y="46" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="18">+</text>

    <rect x="1244" y="22" width="84" height="36" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <text x="1286" y="45" text-anchor="middle" fill="#CBD2D9" font-family="Inter, sans-serif" font-size="12">Reset</text>

    <rect x="1356" y="22" width="44" height="36" rx="2" fill="#FFFFFF"/>
    <text x="1378" y="46" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="16" font-weight="600">✕</text>

    <!-- Left Arrow Button (Previous Image) -->
    <rect x="40" y="410" width="48" height="48" rx="2" fill="#FFFFFF"/>
    <path d="M68 426L58 434L68 442" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Zoomed Image Frame -->
    <rect x="260" y="94" width="920" height="660" rx="2" fill="#EEF0F3" stroke="#3A3A3A"/>
    <text x="720" y="416" text-anchor="middle" fill="#1F1F1F" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500">ZOOMED PRODUCT IMAGE STAGE (150%)</text>
    <text x="720" y="442" text-anchor="middle" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="12">Click + / − to zoom in or out · Drag to pan · Use ‹ › arrows for next image</text>

    <!-- Right Arrow Button (Next Image) -->
    <rect x="1352" y="410" width="48" height="48" rx="2" fill="#FFFFFF"/>
    <path d="M1372 426L1382 434L1372 442" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Thumbnail Strip -->
    <rect x="540" y="784" width="80" height="80" rx="2" fill="#EEF0F3" stroke="#C8A96B" stroke-width="2.5"/>
    <rect x="636" y="784" width="80" height="80" rx="2" fill="#EEF0F3" stroke="#3A3A3A"/>
    <rect x="732" y="784" width="80" height="80" rx="2" fill="#EEF0F3" stroke="#3A3A3A"/>
    <rect x="828" y="784" width="80" height="80" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <polygon points="862,814 878,824 862,834" fill="#C8A96B"/>
  </g>

  <!-- ========================================================= -->
  <!-- 2. MOBILE IMAGE ZOOM MODAL (390 x 844)                    -->
  <!-- ========================================================= -->
  <g id="02-Mobile-Image-Zoom-Modal" transform="translate(1530, 52)">
    <rect width="390" height="844" rx="2" fill="#1F1F1F" fill-opacity="0.96"/>

    <!-- Top Bar -->
    <text x="16" y="38" fill="#F8F9FA" font-family="JetBrains Mono, monospace" font-size="12">1 / 4  ·  150% ZOOM</text>
    <rect x="338" y="16" width="36" height="36" rx="2" fill="#FFFFFF"/>
    <text x="356" y="40" text-anchor="middle" fill="#1F1F1F" font-family="Inter, sans-serif" font-size="15" font-weight="600">✕</text>

    <!-- Zoomed Image Frame -->
    <rect x="16" y="136" width="358" height="460" rx="2" fill="#EEF0F3"/>
    <text x="195" y="362" text-anchor="middle" fill="#1F1F1F" font-family="JetBrains Mono, monospace" font-size="11">ZOOMED IMAGE (150%)</text>
    <text x="195" y="384" text-anchor="middle" fill="#6E7C7C" font-family="Inter, sans-serif" font-size="11">Pinch or tap + / − · Tap ‹ › for next</text>

    <!-- Prev / Next Arrow Buttons -->
    <rect x="24" y="346" width="36" height="36" rx="2" fill="#FFFFFF"/>
    <path d="M44 358L38 364L44 370" stroke="#1F1F1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="330" y="346" width="36" height="36" rx="2" fill="#FFFFFF"/>
    <path d="M346 358L352 364L346 370" stroke="#1F1F1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Zoom Controls -->
    <rect x="95" y="628" width="44" height="40" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <text x="117" y="654" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="18">−</text>
    <rect x="147" y="628" width="96" height="40" rx="2" fill="#2A2A2A" stroke="#C8A96B"/>
    <text x="195" y="653" text-anchor="middle" fill="#C8A96B" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">150% · Reset</text>
    <rect x="251" y="628" width="44" height="40" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <text x="273" y="654" text-anchor="middle" fill="#F8F9FA" font-family="Inter, sans-serif" font-size="18">+</text>

    <!-- Bottom Thumbnails -->
    <rect x="35" y="704" width="72" height="72" rx="2" fill="#EEF0F3" stroke="#C8A96B" stroke-width="2.5"/>
    <rect x="117" y="704" width="72" height="72" rx="2" fill="#EEF0F3" stroke="#3A3A3A"/>
    <rect x="199" y="704" width="72" height="72" rx="2" fill="#EEF0F3" stroke="#3A3A3A"/>
    <rect x="281" y="704" width="72" height="72" rx="2" fill="#2A2A2A" stroke="#3A3A3A"/>
    <polygon points="312,732 326,740 312,748" fill="#C8A96B"/>
  </g>
</svg>
