<svg width="390" height="1420" viewBox="0 0 390 1420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Checkout-Mobile-BG" width="390" height="1420" fill="#FFFFFF"/>

  <!-- 01. MOBILE CHECKOUT HEADER -->
  <g id="01-Mobile-Checkout-Header">
    <rect width="390" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="56" x2="390" y2="56" stroke="#E5E5E5"/>
    <text x="16" y="33" fill="#525252" font-family="Inter, sans-serif" font-size="13">← Bag</text>
    <text x="195" y="34" text-anchor="middle" fill="#111111" font-family="Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="1.6">SHOKH</text>
    <text x="374" y="33" text-anchor="end" fill="#8A8A8A" font-family="JetBrains Mono, monospace" font-size="10">COD</text>
  </g>

  <!-- 02. COLLAPSIBLE ORDER SUMMARY BAR -->
  <g id="02-Mobile-Summary-Toggle">
    <rect y="56" width="390" height="52" fill="#F7F7F7"/>
    <line x1="0" y1="108" x2="390" y2="108" stroke="#E5E5E5"/>
    <text x="16" y="87" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">Order Summary (2 items) ▾</text>
    <text x="374" y="87" text-anchor="end" fill="#111111" font-family="Inter, sans-serif" font-size="15" font-weight="600">৳ 3,640</text>
  </g>

  <!-- 03. MOBILE CHECKOUT FORM -->
  <g id="03-Mobile-Checkout-Form">
    <text x="16" y="146" fill="#111111" font-family="Inter, sans-serif" font-size="22" font-weight="500">Checkout</text>
    <rect x="16" y="164" width="358" height="40" rx="2" fill="#F7F7F7" stroke="#E5E5E5"/>
    <text x="28" y="188" fill="#525252" font-family="Inter, sans-serif" font-size="12">Guest Checkout · <tspan fill="#111111" font-weight="500">Sign in</tspan></text>

    <text x="16" y="236" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Full Name *</text>
    <rect x="16" y="244" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="28" y="271" fill="#111111" font-family="Inter, sans-serif" font-size="14">Tanvir Ahmed</text>

    <text x="16" y="314" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">BD Phone Number *</text>
    <rect x="16" y="322" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="28" y="349" fill="#111111" font-family="JetBrains Mono, monospace" font-size="13">01712345678</text>

    <text x="16" y="392" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Email (Optional)</text>
    <rect x="16" y="400" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="28" y="427" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">tanvir@example.com</text>

    <text x="16" y="470" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Division &amp; District *</text>
    <rect x="16" y="478" width="172" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="28" y="505" fill="#111111" font-family="Inter, sans-serif" font-size="13">Dhaka ▾</text>
    <rect x="202" y="478" width="172" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="214" y="505" fill="#111111" font-family="Inter, sans-serif" font-size="13">Dhaka Metro ▾</text>

    <text x="16" y="548" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Full Delivery Address *</text>
    <rect x="16" y="556" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="28" y="583" fill="#111111" font-family="Inter, sans-serif" font-size="13">House 14, Road 6, Dhanmondi, Dhaka</text>

    <text x="16" y="626" fill="#525252" font-family="Inter, sans-serif" font-size="12" font-weight="500">Delivery Note (Optional)</text>
    <rect x="16" y="634" width="358" height="44" rx="2" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="28" y="661" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Call before arriving at the gate</text>

    <rect x="16" y="698" width="358" height="58" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="32" y="724" fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="500">● Cash on Delivery (COD)</text>
    <text x="32" y="744" fill="#525252" font-family="Inter, sans-serif" font-size="11">Inside Dhaka: Free (Over ৳ 3,000)</text>

    <rect x="16" y="776" width="358" height="48" rx="2" fill="#111111"/>
    <text x="195" y="805" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="500">Place Order (COD) · ৳ 3,640</text>
  </g>

  <!-- 04. MOBILE FOOTER (EXACT GLOBAL MOBILE FOOTER) -->
  <g id="04-Mobile-Footer" transform="translate(0, 900)">
    <rect width="390" height="520" fill="#111111"/>
    <text x="16" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">SHOKH</text>
    <text x="16" y="76" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Minimalist everyday objects &amp; hobby goods</text>
    <text x="16" y="96" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">curated for Bangladesh.</text>
    <text x="16" y="128" fill="#D4D4D4" font-family="JetBrains Mono, monospace" font-size="11">support@shokh.bd · +880 1XXX-XXXXXX</text>

    <text x="16" y="176" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">SHOP</text>
    <text x="16" y="204" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">All Products</text>
    <text x="16" y="230" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Watches</text>
    <text x="16" y="256" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Glasses</text>
    <text x="16" y="282" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Crocs · T-Shirts · Hobby</text>

    <text x="210" y="176" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">SUPPORT</text>
    <text x="210" y="204" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Track Order</text>
    <text x="210" y="230" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Delivery &amp; COD</text>
    <text x="210" y="256" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">7-Day Exchange</text>
    <text x="210" y="282" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="13">Sign In / Account</text>

    <rect x="16" y="330" width="358" height="36" rx="2" fill="#1F1F1F" stroke="#2A2A2A"/>
    <text x="195" y="352" text-anchor="middle" fill="#D4D4D4" font-family="JetBrains Mono, monospace" font-size="11">COD NATIONWIDE · DHAKA ৳ 70 · OUTSIDE ৳ 130</text>
    <text x="16" y="400" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="500">Instagram  ·  Facebook  ·  YouTube</text>

    <line x1="16" y1="432" x2="374" y2="432" stroke="#2A2A2A"/>
    <text x="16" y="466" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11">© 2026 SHOKH Bangladesh. All rights reserved.</text>
    <text x="16" y="486" fill="#525252" font-family="Inter, sans-serif" font-size="11">Privacy Policy · Terms · BDT (৳)</text>
  </g>
</svg>
